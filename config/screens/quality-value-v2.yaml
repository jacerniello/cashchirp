# quality-value v2 — the example screen, re-cut by a point-in-time gate audit.
#
# Built from DISCOVERY data only (rebalance dates 1 Jan 2003–2012, forward windows to 2014);
# the 2015–2022 holdout was evaluated once, afterwards (see docs/RESEARCH.md, "Screen
# studies"). Objective: within the universe below, remove losers and keep winners —
# primary labels: WINNER = top 20% of forward 24-month total return among that date's
# universe, LOSER = bottom 20% or stopped trading at a loss. Secondary: ≥ +50% / ≤ −30%.
#
# Discovery evidence quoted in the comments is from
#   python -m core.backend.backtest.run --kind gate-audit --screen quality-value --periods discovery
#   python -m core.backend.backtest.run --kind signal-study --screen quality-value
# ("win/lose kept" = share of the kept names that were winners/losers; universe base rates
# are 20.0% / 20.8%. "excess" = mean over dates of kept-median minus universe-median
# forward 24m return.) v1 on discovery: 43.6 names/date, win 21.3% / lose 14.4% kept,
# excess +2.1%/24m, beat the universe median in 6 of 10 years.
# v2 on discovery: 143.7 names/date, win 20.7% / lose 12.8% kept, excess +5.1%/24m,
# 8 of 10 years; secondary labels: lose 11.9% kept vs v1 14.2%.
id: quality-value-v2
title: Small/mid cash-generative compounders on sale (v2)
description: >
  Small/mid caps that earn a high return on capital, generate cash, have compounded
  sales and earnings for five years without diluting shareholders, and trade at a low
  multiple of EBITDA and free cash flow. v2 of quality-value: the same thesis with the
  gates that did not separate winners from losers in a point-in-time audit removed —
  the test is whether a re-rating plus continued compounding beats the universe.

criteria:
  - Small/mid cap ($300M-$10B) - room to re-rate, under-followed
  - "Quality: ROIC >= 12%"
  - "Compounding: 5y sales & EPS growth >= 3% - or a turnaround from losses; no net dilution (5y share CAGR <= 2%)"
  - "On sale: EV/EBITDA 0-14, P/FCF 0-20 (positive EBITDA and free cash flow)"
  - Excludes commodities & biotech

universe:
  # Unchanged from v1, so v1 and v2 are judged on the same universe and the same labels.
  exclude_sectors: [Energy, Basic Materials]
  exclude_industries:
    - Biotechnology
    - Drug Manufacturers - Specialty & Generic
    - Drug Manufacturers - General
    - Drug Manufacturers - Major
  exclude_delisted: true

gates:
  marketcap:      {min: 3.0e+8, max: 1.0e+10}   # the universe band (unchanged)
  # The strongest single gate. Alone it keeps 64.9% of winners and removes 52.2% of
  # losers (edge +0.171; the next best is +0.08). Most of that is `min: 0` — negative
  # EBITDA is where losers live (bottom EBITDA/EV quintile: 33.8% losers vs 14-22%
  # elsewhere). The cap of 14 sits on the declared grid; tighter caps (8, 10) raise the
  # winner rate but cut breadth, 18+ admits more losers.
  ev_ebitda:      {min: 0, max: 14}
  # Second-best alone (edge +0.080, loser removal 63%). Leave-one-out: dropping it lets
  # 188 obs back in at a 20.2% loser rate vs 14.4% in the screen. FCF yield is monotonic
  # across quintiles (Spearman +0.9). `min: 0` also implies positive FCF (v1's `fcf > 0`
  # gate was redundant: leave-one-out let back 0 names).
  p_fcf:          {min: 0, max: 20}
  # Alone ROIC peaks at 5% (edge +0.094) and the screen is insensitive to 5-15%, but the
  # bottom ROIC quintile holds 29% losers; kept at v1's 12% because loosening to 5% left
  # the kept loser rate unchanged (12.7%) but diluted the winner rate (20.1% vs 20.7%)
  # and the per-date excess (+4.9% vs +5.1%).
  roic:           {min: 0.12}
  # Dilution is the clearest monotonic loser signal (5y share CAGR quintiles: Spearman
  # -1.0; top-dilution quintile 26.6% losers). Leave-one-out: dropping it raised the kept
  # loser rate from 14.4% to 16.2%. Blank (no 5y history) = no evidence of dilution.
  shares_cagr_5y: {max: 0.02, on_null: 0}

# Recovery-aware growth gates, unchanged. Leave-one-out on discovery: dropping both
# doubles the names (288/date) but raises the kept loser rate 12.8% -> 15.3%.
growth:
  - {level: eps_y, level_5y_ago: eps_y5, cagr: eps_g_5y, min_cagr: 0.03}
  - {level: rev_y, level_5y_ago: rev_y5, cagr: sales_g_5y, min_cagr: 0.03}

# REMOVED from v1, with the discovery evidence:
#   net_margin >= 5%   alone edge -0.008 (removes winners as often as losers); without it
#                      the screen kept MORE winners (22.6% vs 21.3%) and fewer losers.
#   altman_z >= 3      alone edge -0.007; Z >= 4/5 is worse (-0.034/-0.046). Z rewards a
#                      high market cap relative to liabilities, which fights the value gates.
#   debt_equity <= 1   alone edge -0.048 (low-debt names were MORE often losers); without
#                      it the screen's per-date excess rose (+2.8% vs +2.1%).
#   pe <= 20           duplicates ev_ebitda/p_fcf; without it the kept loser rate fell
#                      (13.6% vs 14.4%) and excess rose (+4.3% vs +2.1%).
#   gross_margin >=25% alone edge 0.000; leave-one-out neutral.
#   years_public >= 5  leave-one-out let back 5 obs/period — neutral, and the 5-year growth
#                      rules already need 5 years of filings.
#   fcf > 0            implied by p_fcf min 0.
# NOT ADDED (monotonic in the universe, but redundant inside this screen on discovery):
#   ev_sales <= 2.5 (kept loser rate 13.2% vs 12.8% without), 1y share change <= 5%
#   (12.6% vs 12.8%: within noise), 1y volatility <= 0.5 (removes losers but removes
#   winners faster: secondary-label edge 0.052 -> 0.024).
